<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>QR Code Management Page</title>
        <link th:href="@{/css/main.css}" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container pt-5">
            <h2>QR Code Management</h2>
            <a th:href="@{/qr/generate-qr/image}">
                <button type="button" class="btn btn-outline-success">Generate QR Code</button>
            </a> &nbsp;
            <a th:href="@{/qr/read-qr/image}">
                <button type="button" class="btn btn-outline-warning">Read QR Code</button>
            </a> &nbsp;
            <a th:href="@{/}">
                <button type="button" class="button welcome-button">Go to welcome</button>
            </a>
        </div>
    </body>
</html>
