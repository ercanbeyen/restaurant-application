<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Read QR Code Page</title>
        <link th:href="@{/css/main.css}" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container pt-5">
            <h2>QR Code Reader</h2>
            <p>Please attach the QR code image.</p>
            <form th:action="@{/qr/read}" method="post" enctype="multipart/form-data">
                <div>
                    <label for="fileInput"><b>Choose File:</b></label>
                    <input type="file" id="fileInput" name="file" />
                </div>
                <br/>
                <button type="submit" class="button sendForm-button">Upload</button>
            </form>
            <div>
                <a th:href="@{/qr/qr-management}">
                    <button type="button" class="btn btn-primary btn-lg float-end btn-gap">Go to QR Code management</button>
                </a>
            </div>
        </div>
    </body>
</html>
