<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Generate QR Code Page</title>
        <link th:href="@{/css/main.css}" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container pt-5">
            <h2>QR Code Generator</h2>
            <p>Please add the text to be converted into a QR code.</p>
            <form th:action="@{/qr/generate/image(text=${text})}" method="get">
                <label for="qrText"><b>Text:</b></label>
                <input type="text" name="text" id="qrText" placeholder="Text" />
                <br/>
                <button type="submit" class="button sendForm-button">Generate QR Code</button>
            </form>
            <div>
                <a th:href="@{/qr/qr-management}">
                    <button type="button" class="btn btn-primary btn-lg float-end btn-gap">Go to QR Code management</button>
                </a>
            </div>
        </div>
    </body>
</html>
